# ──GeneralRecommender ──────────────────────────────
is_multimodal_model: true
end2end: False
vision_feature_file: image_feat.npy   
text_feature_file:   text_feat.npy    

# ── Embedding ────────────────────────────────────────────────────────
embedding_size: 64

# ── MKGAT layers ─────────────────────────────────────────────────────            
aggregation_type: concat    # "add" | "concat"

# ── Hyperparameters ─────────────────────────────────────────────────────────────
leaky_relu_slope: [0.01, 0.1, 0.2]
reg_weight: [0.01, 0.001, 0.0001]
learning_rate: [0:0001, 0:0005, 0:001]
dropout_ratio: [0.0, 0.1, 0.2]
n_layers: [1,2,3]
hyper_parameters: ["reg_weight", "learning_rate", "leaky_relu_slope", "dropout_ratio", "n_layers"]

 

# ── Representation format ─────────────────────────────────────────────────────────────
model_enriched_triples_format: True # We have triples covering the user-item, item-item and the item-attributes relations